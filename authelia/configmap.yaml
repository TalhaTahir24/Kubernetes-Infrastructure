apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: authelia
data:
  configuration.yml: |
    theme: dark
    log_level: info

    default_redirection_url: https://authelia.dc1.local

    server:
      host: 0.0.0.0
      port: 9091

    identity_validation:
      reset_password:
        jwt_lifespan: 5m

    authentication_backend:
      ldap:
        address: ldap://openldap.ldap.svc.cluster.local
        base_dn: dc=dc1,dc=local
        users_filter: (&({username_attribute}={input})(objectClass=person))
        username_attribute: uid
        additional_users_dn: ou=users

    access_control:
      default_policy: deny
      rules:
      - domain: authelia.dc1.local
        policy: bypass

    session:
      name: authelia_session
      expiration: 1h
      inactivity: 5m
      domain: dc1.local

    regulation:
      max_retries: 3
      find_time: 2m
      ban_time: 5m

    storage:
      local:
        path: /data/db.sqlite3

    notifier:
      filesystem:
        filename: /data/notifications.txt
